<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tarjeta Intertech E.I.R.L. — Compacta & Pulida</title>
<style>
  /* ================= Vars ================= */
  :root{
    --prim:#1E3A5F;           /* azul acero */
    --prim-d:#172c49;         /* azul más profundo */
    --prim-l:#2b4f7d;         /* azul aclarado */
    --acc:#B7410E;            /* acento maquinaria */
    --acc-l:#d75a18;
    --ink:#222;               /* texto principal */
    --ink-2:#3a3f45;
    --muted:#8f9aa3;
    --paper:#ffffff;
    --bg:#F4F6F8;

    --r:12px;
    --shadow:0 8px 18px rgba(0,0,0,.16);
    --font:'Inter', 'Helvetica Neue', Arial, sans-serif;
    --fontTit:'Segoe UI', system-ui, Arial, sans-serif;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; padding:20px; background:var(--bg);
    font-family:var(--font); color:var(--ink);
    display:flex; gap:28px; flex-wrap:wrap; justify-content:center; align-items:center;
  }

  /* ============== Card base (3.5in x 2in) ============== */
  .card{
    width:3.5in; height:2in; border-radius:var(--r);
    overflow:hidden; background:var(--paper); box-shadow:var(--shadow);
    position:relative;
  }
  .face{position:relative; width:100%; height:100%}

  /* ======================================================
     ANVERSO — Compacto, color pulido
     ====================================================== */
  .front{
    /* mezcla sutil de tonos del primario y acento */
    background:
      linear-gradient(135deg, var(--prim-d) 0 58%,
        color-mix(in srgb, var(--prim) 70%, var(--acc)) 58% 72%,
        var(--acc) 72% 100%);
    color:#fff;
  }

  /* textura técnica muy sutil */
  .front::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.6px);
    background-size:8px 8px; opacity:.55; mix-blend-mode:soft-light;
  }

  /* bloque de contenido reducido */
  .front-wrap{
    position:absolute; inset:14px; display:grid; grid-template-rows:auto 1fr; z-index:2;
  }
  .logo{
    font-family:var(--fontTit); font-weight:800; letter-spacing:.09em;
    font-size:.98em; line-height:1.05; text-transform:uppercase;
    text-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .slogan{
    align-self:end; max-width:72%;
    font-size:.72em; font-weight:600; letter-spacing:.01em;
    padding:.35rem .55rem; border-radius:9px;
    background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
    border:1px solid rgba(255,255,255,.16);
  }

  /* engrane más pequeño */
  .gear{
    position:absolute; right:-10px; bottom:-10px; width:70px; height:70px; opacity:.5;
    transform:rotate(-18deg); filter:drop-shadow(0 2px 6px rgba(0,0,0,.25));
  }
  .gear svg{width:100%; height:100%; fill:rgba(255,255,255,.92)}

  /* filete vertical de acento más fino */
  .accent{
    position:absolute; top:0; right:0; width:4px; height:100%;
    background:linear-gradient(180deg, #ffc9aa 0, var(--acc) 50%, #6e2b07 100%);
  }

  /* ======================================================
     REVERSO — Mosaico técnico + info compacta
     ====================================================== */
  .back{ background:#fff; color:var(--ink) }

  /* bloque diagonal más contenido (compacto) */
  .diag{
    position:absolute; inset:-1px 46% -1px -1px; transform:skewX(-14deg);
    background:linear-gradient(180deg, var(--prim-l) 0%, var(--prim) 48%, var(--prim-d) 100%);
    box-shadow:inset -14px 0 26px rgba(0,0,0,.18);
    z-index:0;
  }
  .diag::after{
    content:""; position:absolute; top:0; right:-3px; width:4px; height:100%;
    background:linear-gradient(180deg, #ffd1ba 0, var(--acc-l) 45%, var(--acc) 100%);
  }

  /* mosaico de pictogramas (marca) en baja opacidad */
  .tile{
    position:absolute; inset:8px 55% 8px 8px; transform:skewX(14deg); z-index:1;
    display:grid; grid-template-columns:repeat(4, 1fr); grid-auto-rows:28px; gap:8px; opacity:.18;
  }
  .tile svg{width:100%; height:100%; fill:#0f1830}

  /* mini logo */
  .brand-small{
    position:absolute; top:8px; left:12px; transform:skewX(14deg); z-index:2;
    color:#eaf1fb; font-family:var(--fontTit); font-weight:800; letter-spacing:.09em;
    text-transform:uppercase; font-size:.9em; text-shadow:0 1px 4px rgba(0,0,0,.28);
  }

  /* columna derecha: más compacta */
  .content{
    position:absolute; right:12px; top:10px; bottom:10px; left:52%;
    display:grid; grid-template-rows:auto 1fr auto; gap:8px; z-index:2;
  }
  .person{
    border-bottom:1px dashed #d8dee6; padding-bottom:4px;
  }
  .name{
    margin:0; font-weight:800; font-size:.92em; letter-spacing:.01em; color:var(--ink-2);
  }
  .role{
    margin:.15rem 0 0; font-size:.76em; font-weight:700; color:var(--prim); text-transform:uppercase; letter-spacing:.03em;
  }

  .contact{ list-style:none; margin:.35rem 0 0; padding:0; display:grid; gap:6px }
  .contact li{
    display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px;
    font-size:.78em; color:#2f3439;
  }
  .icon{ width:16px; height:16px; color:var(--acc) }
  .icon svg{ width:16px; height:16px; fill:currentColor }

  /* servicios en badges más pequeños */
  .services{ margin-top:6px; display:flex; flex-wrap:wrap; gap:6px }
  .chip{
    display:inline-flex; align-items:center; gap:5px;
    font-size:.68em; font-weight:700; padding:4px 8px; border-radius:999px;
    color:var(--prim); background:linear-gradient(180deg, #fff 0, #f2f6fb 100%);
    border:1px solid #d4dde6;
  }
  .dot{ width:8px; height:8px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #ffd9c7 0, var(--acc) 65%, #5b2106 100%);
  }

  .footer{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:4px }
  .web{ font-size:.74em; font-weight:800; color:#222b33 }
  .web a{ color:var(--acc); text-decoration:none; border-bottom:1px dashed transparent; transition:border-color .2s }
  .web a:hover{ border-color:var(--acc) }

  .qr{
    width:40px; height:40px; border-radius:7px; position:relative; overflow:hidden;
    background:conic-gradient(from 90deg, #eef2f7, #fafcff, #eef2f7);
    border:1.2px solid #c8d2dc; display:grid; place-items:center;
  }
  .qr::after{ content:""; position:absolute; inset:5px; border:1px dashed #aeb9c6; border-radius:4px }
  .qr small{ font-size:.5em; color:#7b8794; font-weight:700 }
</style>
</head>
